<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="icon" href="../img/лого.png" type="image/png">
    <title>Libra - Вход в аккаунт</title>
</head>
<body>
    <div class="heroLog"></div>
    <div class="login">
        <form class="formlog" action="/login" method="POST">
            <h1 id="titleLogin">Авторизация</h1>
            <label hidden for="email">Логин</label>
            <input class="input" id="username" name="username" type="text" placeholder=" ✉ Введите логин" autocomplete="off">
            <label hidden for="password">Password</label>
            <input class="input" name="password" id="password" type="password" placeholder="Введите пароль">
             <p id="errorMsg" style="color: red;"></p>
            <button id="enter">Войти</button>
            <a id="registration" href="register.html">Регистрация</a>
        </form>
    </div>
     <div class="heroLog2"></div>
    <script src="/scripts/login.js"></script>
</body>
</html>
