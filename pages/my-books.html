<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="icon" href="../img/лого.png" type="image/png">
    <title>Libra - Мои книги</title>
</head>
<body>
    <header>
        <div id="topak">  
            <a id="akk" href="login.html">Войти</a>
        </div>
        <div id="menu">
            <h2 class="nameweb">МОИ КНИГИ</h2>
            <img src="../img/лого.png" alt="логотип" id="logo">
            <button class="burger" id="burger">&#9776;</button>
               <ul class="ulmenu">
                    <li class="limenu">
                         <a href="index.html">Главная</a>
                     </li>
                     <li class="limenu">
                          <a href="catalog.html">Найти книгу</a>
                     </li>
                     <li class="limenu">
                         <a href="favorites.html">Избранное</a>
                     </li>
                     <li class="limenu">
                         <a href="my-books.html"><b>Мои книги</b></a>
                     </li>
             </ul>
        </div>
    </header>
    <main>
        <div class="my-books-layout">
            <div class="books-grid books-container"
    id="booksContainer">
            </div>
            <div class="parent-upload">
                <div class="upload-sidebar" id="upload-sidebar">⬇  Загрузить книгу
            </div>
            </div>
        </div>
<div class="modal-overlay" id="uploadModal">
    <div class="upload-modal-card">
        <span class="modal-close" id="uploadModalClose">&times;</span>
        <h3>Загрузить книгу</h3>
        <input type="text" id="bookTitle" placeholder="Название книги">
        <input type="text" id="bookAuthor" placeholder="Автор">
        <input type="text" id="bookYear" placeholder="Год">
        <input type="text" id="bookPages" placeholder="Количество страниц">
        <textarea id="bookDescription" placeholder="Описание"></textarea>
       <label>Файл книги (PDF):</label>
        <input type="file" id="fileInput" accept=".pdf">
        <label>Обложка:</label>
        <input type="file" id="coverInput" accept="image/*">
       
        <button id="saveBook">Сохранить</button>
    </div>
</div>


<div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
        <span class="modal-close" id="modalClose">&times;</span>
        <img id="modalImage" src="" alt="" class="modal-cover">
        <div class="modal-info">
        <h2 id="modalTitle"></h2>
        <p id="modalAuthor"></p>
        <p id="modalYear"></p>
        <p id="modalPages"></p>
        <p id="modalDescription"></p>
        <button class="delete-btn" id="delete">Удалить</button>
    </div>
    </div>
</div>

<script src="../scripts/my-books.js"></script>
<script src="../scripts/modal.js"></script>
<script src="/scripts/auth-check.js"></script>
    </main>
</body>
</html>
