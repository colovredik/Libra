<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=L, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="icon" href="../img/лого.png" type="image/png">
    <title>Libra - Найти книгу</title>
</head>
<body>
    <header>
        <div id="topak">  
            <a id="akk" href="login.html">Войти</a>
        </div>
        <div id="menu">
            <h2 class="nameweb">НАЙТИ КНИГУ</h2>
            <img src="../img/лого.png" alt="логотип" id="logo">
            <button class="burger" id="burger">&#9776;</button>
               <ul class="ulmenu">
                    <li class="limenu">
                         <a href="index.html">Главная</a>
                     </li>
                     <li class="limenu">
                          <a href="catalog.html"><b>Найти книгу</b></a>
                     </li>
                     <li class="limenu">
                         <a href="favorites.html">Избранное</a>
                     </li>
                     <li class="limenu">
                         <a href="my-books.html">Мои книги</a>
                     </li>
             </ul>
        </div>
    </header>
    <main>
        <form class="search">
  <div class="filters">
    <select id="genreFilter" class="droplist">
    <option value="">Все жанры</option>
    <option value="Фентези">Фентези</option>
    <option value="Детектив">Детектив</option>
    <option value="Магический реализм">Магический реализм</option>
    <option value="Сатира">Сатира</option>
    <option value="Реализм">Реализм</option>
    <option value="Научная фантастика">Научная фантастика</option>
    <option value="Повесть">Повесть</option>
    <option value="Трагикомедия">Трагикомедия</option>
    <option value="Роман">Роман</option>
    <option value="Гридмарк">Гридмарк</option>
   

</select>

 <select id="obem" class="droplist">
    <option value="">Любой объём</option>
    <option value="100_500">100-500 ст.</option>
    <option value="500_800">500-800 ст</option>
    <option value="более800">Больше 800</option>
    </select>

   <button
   type="button"
    id="authorFilter"
    class="searchB"
>Автор</button>


<button
    type="button"
    id="titleFilter"
    class="searchB"
>Название</button>

<button
    type="button"
    id="seriesFilter"
    class="searchB"
>Серия</button>


  </div>

  <div class="search-body">
    <input type="search" id="searchInput" placeholder="Введите название..." autocomplete="off">
    <div class="suggestions" id="suggestions"></div>
  </div>
</form>
<div
    class="books-container"
    id="booksContainer"
>
</div>
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
        <span class="modal-close" id="modalClose">&times;</span>
        <img id="modalImage" src="" alt="" class="modal-cover">
        <div class="modal-info">
        <h2 id="modalTitle"></h2>
        <p id="modalAuthor"></p>
        <p id="modalYear"></p>
        <p id="modalPages"></p>
        <p id="modalDescription"></p>
        <span class="modal-fav" id="modal-fav">&#10084;</span>
    </div>
    </div>
</div>
    </main>
    <script src="../scripts/search.js"></script>
    <script src="../scripts/modal.js"></script>
    <script src="/scripts/auth-check.js"></script>
</body>
</html>
